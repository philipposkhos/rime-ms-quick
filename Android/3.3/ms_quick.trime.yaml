# 放到同文「用戶資料夾」根目錄，不要連 Android/3.3 子資料夾一起放
# encoding: utf-8
config_version: "3.6"
name: 傳統速成
author: Kho

style:
  color_scheme: default
  candidate_text_size: 21
  key_text_size: 18
  key_long_text_size: 11
  label_text_size: 14
  symbol_text_size: 10
  vertical_gap: 10
  horizontal_gap: 4
  round_corner: 8
  key_height: 44
  keyboard_height: 280
  keyboard_height_land: 220
  keyboard_padding: 3
  keyboard_padding_bottom: 0
  vertical_correction: -20
  candidate_view_height: 28
  candidate_padding: 5
  # 3.3 長按氣泡會依格子大小自動撐滿，要小必須縮寬高，不能只改字號
  popup_text_size: 16
  popup_height: 34
  popup_width: 28
  popup_key_height: 26
  # 約等於實際鍵高，氣泡底貼齊鍵頂
  popup_bottom_margin: 56

preedit:
  horizontal_padding: 0
  foreground:
    font_size: 16

window:
  insets:
    vertical: 0
    horizontal: 0
  item_padding:
    horizontal: 4
  corner_radius: 3
  border: 0
  shadow: 0
  alpha: 0.87
  foreground:
    label_font_size: 14
    text_font_size: 20
    comment_font_size: 0

tool_bar:
  button_spacing: 12
  buttons:
    - foreground:
        style: "🎨"
        font_size: 20
      action: Color_switch
    - foreground:
        option_styles: ["漢", "汉"]
        font_size: 16
      action: simplification_switch
    - foreground:
        option_styles: ["半", "全"]
        font_size: 16
      action: fullshape_switch
    - foreground:
        style: "📋"
        font_size: 20
      action: clipboard_window
    - foreground:
        style: "🙂"
        font_size: 20
      action: liquid_keyboard_switch

liquid_keyboard:
  row: 5
  row_land: 4
  key_height: 40
  key_height_land: 40
  single_width: 52
  vertical_gap: 4
  margin_x: 4
  fixed_key_bar:
    position: bottom
    keys:
      - liquid_keyboard_exit
      - space
      - BackSpace
      - Return
  keyboards: [history, emoji, cn, ascii]
  history:
    name: 常用
    type: HISTORY
  emoji:
    name: 表情
    type: SINGLE
    keys: "😀😁😂🤣😃😄😅😆😉😊😋😎😍😘🥰😗🙂🤗🤔😐😑😶🙄😏😣😥😮🤐😯😪😫🥱😴😌😛😜😝🤤😒😓😔😕🙃🤑😲☹🙁😖😞😟😤😢😭😦😧😨😩🤯😬😰😱🥵🥶😳🤪😵🥴😠😡🤬😷🤒🤕🤢🤮🤧😇🥳🥺🤠🤡🤥🤫🤭🧐🤓😈👿💀💩😺😸😹😻😼😽🙀😿😾🙈🙉🙊👍👎👌✌️🤞🤝🙏💪👀"
  cn:
    name: 中文
    type: SINGLE
    keys: "，。？！：；、·…—～「」『』【】（）《》〈〉“”‘’￥"
  ascii:
    name: 英文
    type: SINGLE
    keys: ",.?!:;@#&*-+=/\\|<>()[]{}\"'`~"

fallback_colors:
  candidate_text_color: text_color

preset_color_schemes:
  default:
    name: 預設
    author: Kho
    keyboard_back_color: 0x202124
