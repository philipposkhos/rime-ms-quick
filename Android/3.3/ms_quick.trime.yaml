preset_keys:
  BackSpace: {label: "⌫", repeatable: true, send: BackSpace}
  Shift_L: {label: "⇧", send: Shift_L, shift_lock: long}
  Tab: {label: "↹", send: Tab}
  Return: {label: "⏎", send: Return}
  Home: {label: ⇱, send: Home}
  End: {label: ⇲, send: End}
  Left: {label: "←", send: Left}
  Right: {label: "→", send: Right}
  Up: {label: "↑", send: Up}
  Down: {label: "↓", send: Down}
  Escape: {label: Esc, send: Escape}
  Delete: {label: 刪除, send: Delete}
  Hide: {label: 隱藏, send: BACK}
  Menu: {label: 方案, send: MENU}
  IME_switch: {label: "🌐", send: LANGUAGE_SWITCH}
  Color_switch: {label: 配色, send: PROG_RED}
  fullshape_switch: {toggle: full_shape, send: SWITCH_CHARSET, states: [半, 全]}
  simplification_switch: {toggle: simplification, send: SWITCH_CHARSET, states: [漢, 汉]}
  clipboard_window: {label: 剪貼, send: function, command: clipboard_window, option: "0"}
  liquid_keyboard_switch: {label: 🙂, send: function, command: liquid_keyboard, option: "常用"}
  liquid_keyboard_exit: {label: 返回, send: function, command: liquid_keyboard, option: "-1"}
  select_all: {label: 全選, send: Control+a}
  cut: {label: 剪下, send: Control+x}
  copy: {label: 複製, send: Control+c}
  paste: {label: 貼上, send: Control+v}
  undo: {label: 撤銷, send: Control+z}
  redo: {label: 重做, send: Control+Shift+z}
  Keyboard_default: {label: 中, send: Eisu_toggle, select: .default}
  Keyboard_quick: {label: 中, send: Eisu_toggle, select: .default}
  Keyboard_ms_quick_latin: {label: 西, send: Eisu_toggle, select: ms_quick_latin}
  Keyboard_ms_quick_number: {label: 數字, send: Eisu_toggle, select: ms_quick_number}
  Keyboard_ms_quick_symbols: {label: 符號, send: Eisu_toggle, select: ms_quick_symbols}
  space: {repeatable: false, functional: false, preview: "⎵", send: space}
  quick_q: {label: "手", preview: "手", send: q}
  quick_w: {label: "田", preview: "田", send: w}
  quick_e: {label: "水", preview: "水", send: e}
  quick_r: {label: "口", preview: "口", send: r}
  quick_t: {label: "廿", preview: "廿", send: t}
  quick_y: {label: "卜", preview: "卜", send: y}
  quick_u: {label: "山", preview: "山", send: u}
  quick_i: {label: "戈", preview: "戈", send: i}
  quick_o: {label: "人", preview: "人", send: o}
  quick_p: {label: "心", preview: "心", send: p}
  quick_a: {label: "日", preview: "日", send: a}
  quick_s: {label: "尸", preview: "尸", send: s}
  quick_d: {label: "木", preview: "木", send: d}
  quick_f: {label: "火", preview: "火", send: f}
  quick_g: {label: "土", preview: "土", send: g}
  quick_h: {label: "竹", preview: "竹", send: h}
  quick_j: {label: "十", preview: "十", send: j}
  quick_k: {label: "大", preview: "大", send: k}
  quick_l: {label: "中", preview: "中", send: l}
  quick_z: {label: "符", preview: "符", send: z}
  quick_x: {label: "難", preview: "難", send: x}
  quick_c: {label: "金", preview: "金", send: c}
  quick_v: {label: "女", preview: "女", send: v}
  quick_b: {label: "月", preview: "月", send: b}
  quick_n: {label: "弓", preview: "弓", send: n}
  quick_m: {label: "一", preview: "一", send: m}

preset_keyboards:
  # 沒對上方案 id 時仍有鍵盤可顯示
  default:
    import_preset: ms_quick
  ms_quick:
    ascii_mode: 0
    ascii_keyboard: ms_quick_latin
    name: 傳統速成
    author: Kho
    width: 10
    height: 44
    keyboard_height: 280
    keyboard_height_land: 220
    lock: true
    keys:
    - {click: "1", long_click: "！"}
    - {click: "2", long_click: "@"}
    - {click: "3", long_click: "#"}
    - {click: "4", long_click: "$"}
